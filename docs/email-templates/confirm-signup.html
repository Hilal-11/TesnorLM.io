<!-- Supabase → Authentication → Emails → Confirm signup. Subject: Your TensorLM code: {{ .Token }} -->
<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#F6F7F4;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F6F7F4;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border:1px solid #DCE1DE;border-radius:16px;">
            <tr>
              <td style="padding:32px;font-family:'Hanken Grotesk',Segoe UI,Helvetica,Arial,sans-serif;color:#14212B;">
                <p style="margin:0 0 24px;font-size:15px;font-weight:600;">TensorLM</p>
                <h1 style="margin:0 0 8px;font-size:24px;line-height:32px;font-weight:600;">Confirm your email</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:24px;color:#5B6873;">
                  Enter this code on the page you just left. It works for 30 minutes.
                </p>
                <p style="margin:0 0 24px;padding:16px;background:#F6F7F4;border-radius:8px;text-align:center;font-family:'JetBrains Mono',Consolas,monospace;font-size:32px;line-height:40px;font-weight:600;letter-spacing:8px;color:#14212B;">
                  {{ .Token }}
                </p>
                <p style="margin:0 0 8px;font-size:13px;line-height:20px;color:#5B6873;">Or confirm with this link instead:</p>
                <p style="margin:0 0 24px;">
                  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/onboarding"
                     style="display:inline-block;padding:10px 16px;background:#2449D8;color:#FFFFFF;border-radius:8px;font-size:15px;font-weight:500;text-decoration:none;">Confirm email</a>
                </p>
                <p style="margin:0;font-size:13px;line-height:20px;color:#5B6873;">
                  Didn't sign up for TensorLM? You can ignore this email; no account is created until it's confirmed.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
