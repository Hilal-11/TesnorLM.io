[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    docling: runs real Docling conversions (slow, needs the layout/table models)
    stack: needs the local Supabase stack or a test project (TEST_SUPABASE_*)
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:docling.*
    ignore::DeprecationWarning:supabase.*
    ignore::pydantic.warnings.PydanticDeprecatedSince20
